<!DOCTYPE html>
<html>
<head>
  <title>Student List</title>
</head>
<body>
  <h1>Students</h1>

  {% if students|length == 0 %}
    <p>No students found.</p>
  {% else %}
    <p>Total students: {{ students|length }}</p>
    <table border="1">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Branch</th>
      </tr>
      {% for student in students %}
      <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.branch }}</td>
      </tr>
      {% endfor %}
    </table>
  {% endif %}
</body>
</html>
